name: Financial correctness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '55432'
      DB_USER: dwp
      # Credencial descartável do banco local de CI; não dá acesso a qualquer ambiente externo.
      DB_PASSWORD: ci-disposable-password
      DB_NAME: dwp
      SQS_ENDPOINT: http://127.0.0.1:4566
      AWS_REGION: us-east-1
      MESSAGING_ENABLED: 'true'
      SQS_ALLOWED_PROVIDERS: provider-a
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run infra:up
      - run: bun run db:migrate
      - run: bun run sqs:setup
      # Integração inclui processos independentes, crashes e SIGTERM nativo no Linux.
      - run: bun run test:integration
      - run: bun run test:e2e
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color postgres localstack
      - name: Dispose local infrastructure
        if: always()
        run: docker compose down --volumes
