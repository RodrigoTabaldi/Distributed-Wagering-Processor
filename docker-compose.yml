services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-dwp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-dwp}
    ports:
      - '127.0.0.1:${DB_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
